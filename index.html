<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিমুলতলা সমাজ কল্যাণ সমিতি</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 15px; margin: 0; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2, h3 { color: #2c3e50; margin-top: 0; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; font-weight: bold; font-size: 16px; }
        .receipt { background: #e8f8f5; border-left: 5px solid #27ae60; padding: 10px; display: none; }
    </style>
</head>
<body>

    <h2>🏛️ শিমুলতলা সমাজ কল্যাণ সমিতি</h2>

    <div class="card">
        <h3>💰 সঞ্চয় জমা (Field Officer)</h3>
        <input type="number" id="memberId" placeholder="সদস্য ID লিখুন">
        <input type="number" id="depositAmount" placeholder="টাকার পরিমাণ (৳)">
        <button onclick="collectDeposit()">টাকা জমা করুন</button>
        
        <div id="receiptBox" class="receipt">
            <h4>রসিদ:</h4>
            <p id="receiptText"></p>
        </div>
    </div>

    <div class="card">
        <h3>📊 সামগ্রিক হিসাব (Admin)</h3>
        <button style="background:#2980b9;" onclick="getReport()">রিপোর্ট দেখুন</button>
        <div id="reportResult"></div>
    </div>

    <script>
        const API_URL = "https://samity-backend.onrender.com";

        async function collectDeposit() {
            const memberId = document.getElementById('memberId').value;
            const amount = document.getElementById('depositAmount').value;

            if(!memberId || !amount) {
                alert("সব তথ্য ঠিকভাবে দিন");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/savings/deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-user-role': 'field_officer' },
                    body: JSON.stringify({ memberId: parseInt(memberId), amount: parseFloat(amount) })
                });

                const data = await response.json();
                if(data.success) {
                    document.getElementById('receiptBox').style.display = 'block';
                    document.getElementById('receiptText').innerHTML = 
                        `আইডি: ${data.receipt.transactionId}<br>জমা: ৳${data.receipt.depositedAmount}<br>বর্তমান সঞ্চয়: ৳${data.receipt.currentBalance}`;
                } else {
                    alert(data.message);
                }
            } catch(err) {
                alert("সার্ভারের সাথে সংযোগ করা যায়নি।");
            }
        }

        async function getReport() {
            try {
                const response = await fetch(`${API_URL}/reports/financial`, {
                    headers: { 'x-user-role': 'admin' }
                });
                const data = await response.json();
                if(data.success) {
                    document.getElementById('reportResult').innerHTML = `
                        <p>মোট সঞ্চয়: ৳${data.summary.totalSavingsBalance}</p>
                    `;
                }
            } catch(err) {
                alert("রিপোর্ট লোড করা যায়নি।");
            }
        }
    </script>
</body>
</html>
