<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিমুলতলা সমাজকল্যাণ সমবায় সমিতি</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; }

        /* আগের সেই সবুজ হেডার ও মেনু স্টাইল */
        .site-header { 
            background: #1b5e20; 
            color: white; 
            padding: 12px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header-brand { display: flex; align-items: center; gap: 12px; }
        .header-icon { font-size: 28px; }
        .header-text h1 { font-size: 16px; font-weight: bold; margin-bottom: 2px; }
        .header-text p { font-size: 11px; opacity: 0.9; }

        /* মেনু বার / ড্রপডাউন */
        .menu-btn { font-size: 22px; cursor: pointer; color: white; background: none; border: none; }
        
        .nav-drawer {
            display: none;
            background: #2e7d32;
            padding: 10px 15px;
        }
        .nav-drawer a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .nav-drawer a:hover { color: #ffebee; }

        .container { max-width: 600px; margin: 20px auto; padding: 0 10px; }

        /* পরিচালক কার্ড স্টাইল (স্ক্রিনশটের মতো হুবহু) */
        .director-card { 
            background: white; 
            border: 1px solid #c8e6c9; 
            border-radius: 10px; 
            padding: 25px 15px; 
            text-align: center; 
            margin-bottom: 20px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.05); 
        }
        .director-img { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid #2e7d32; 
            margin: 0 auto 12px; 
            display: block;
        }
        .director-name { font-weight: bold; font-size: 18px; color: #1b5e20; margin-bottom: 5px; }
        .director-role { 
            display: inline-block;
            background: #ffe0b2; 
            color: #e65100; 
            padding: 3px 12px; 
            border-radius: 15px; 
            font-size: 13px; 
            font-weight: bold; 
            margin-bottom: 8px; 
        }
        .director-somitee { font-size: 13px; color: #555; }

        /* নোটিশ ও পরিচিতি কার্ড */
        .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .section-title { color: #1b5e20; border-bottom: 2px solid #e8f5e9; padding-bottom: 6px; margin-bottom: 12px; font-size: 15px; font-weight: bold; }
        .notice-box { background: #fffde7; border-left: 4px solid #fbc02d; padding: 10px; margin-bottom: 8px; font-size: 13px; border-radius: 4px; }

        footer { text-align: center; padding: 15px; font-size: 12px; color: #777; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- হেডার ও মেনু -->
    <header class="site-header">
        <div class="header-brand">
            <span class="header-icon">🏛️</span>
            <div class="header-text">
                <h1 id="displayName">শিমুলতলা সমাজকল্যাণ সমবায় সমিতি</h1>
                <p id="displayAddress">ইসলামপুর, জামালপুর</p>
            </div>
        </div>
        <button class="menu-btn" id="menuToggleBtn">☰</button>
    </header>

    <div class="nav-drawer" id="navDrawer">
        <a href="index.html">🏠 হোমপেজ</a>
        <a href="member-login.html">🔑 সদস্য লগইন</a>
        <a href="admin-login.html">⚙️ এডমিন লগইন</a>
    </div>

    <div class="container">
        <!-- নোটিশ বোর্ড -->
        <div class="card" id="noticeSection">
            <div class="section-title">📢 জরুরি নোটিশ</div>
            <div id="notice1" class="notice-box">কোনো নতুন নোটিশ নেই।</div>
            <div id="notice2" class="notice-box" style="display:none;"></div>
        </div>

        <!-- পরিচালক মন্ডলী -->
        <div id="directorsContainer">
            <!-- ডায়নামিক পরিচালক কার্ড এখানে লোড হবে -->
        </div>
    </div>

    <footer>
        &copy; ২০২৬ শিমুলতলা সমাজকল্যাণ সমবায় সমিতি | সর্বস্বত্ব সংরক্ষিত।
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // মেনু ড্রপডাউন টগল
        document.getElementById('menuToggleBtn').addEventListener('click', () => {
            const drawer = document.getElementById('navDrawer');
            drawer.style.display = drawer.style.display === 'block' ? 'none' : 'block';
        });

        const firebaseConfig = {
            apiKey: "AIzaSyCU0D4b0D2T9QcR5k7JKPNXH-l_BXdbtX4",
            authDomain: "shimultola-somittee.firebaseapp.com",
            databaseURL: "https://shimultola-somittee-default-rtdb.firebaseio.com",
            projectId: "shimultola-somittee",
            storageBucket: "shimultola-somittee.firebasestorage.app",
            messagingSenderId: "889093640093",
            appId: "1:889093640093:web:2092d82fadf427f6fb2974",
            measurementId: "G-87QSPJ2M1R"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'siteData'), (snapshot) => {
            if(snapshot.exists()) {
                const data = snapshot.val();
                if(data.name) document.getElementById('displayName').innerText = data.name;
                if(data.address) document.getElementById('displayAddress').innerText = data.address;

                if(data.notice1) {
                    document.getElementById('notice1').innerText = data.notice1;
                }
                if(data.notice2) {
                    document.getElementById('notice2').innerText = data.notice2;
                    document.getElementById('notice2').style.display = 'block';
                }

                // পরিচালক তালিকা স্ক্রিনশটের ডিজাইনে রেন্ডার করা
                const container = document.getElementById('directorsContainer');
                container.innerHTML = '';
                if(data.directors && data.directors.length > 0) {
                    data.directors.forEach(d => {
                        const div = document.createElement('div');
                        div.className = 'director-card';
                        div.innerHTML = `
                            <img src="${d.img || 'https://via.placeholder.com/110'}" class="director-img">
                            <div class="director-name">${d.name}</div>
                            <div class="director-role">${d.role}</div>
                            <div class="director-somitee">${data.name || 'শিমুলতলা সমাজকল্যাণ সমবায় সমিতি'}</div>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = '<div class="card"><p style="text-align:center;">কোনো পরিচালকের তথ্য পাওয়া যায়নি।</p></div>';
                }
            }
        });
    </script>
</body>
</html>
