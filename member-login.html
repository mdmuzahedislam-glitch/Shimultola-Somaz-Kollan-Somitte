<script>
    let currentMemberObj = null;

    // সিকিউরিটি ভেরিফিকেশন (পপআপ ছাড়া সরাসরি লগইন পেজে রিডাইরেক্ট)
    window.onload = function() {
        const loggedInUser = sessionStorage.getItem('loggedInMember');

        if (!loggedInUser) {
            // লগইন না থাকলে পপআপ না দেখিয়ে সরাসরি লগইন পেজে পাঠিয়ে দেবে
            window.location.href = 'member-login.html';
            return;
        }

        const memberData = JSON.parse(loggedInUser);
        const allMembers = JSON.parse(localStorage.getItem('somitte_members')) || [];
        
        currentMemberObj = allMembers.find(m => m.id === memberData.id && m.username === memberData.username);

        if (!currentMemberObj) {
            sessionStorage.removeItem('loggedInMember');
            window.location.href = 'member-login.html';
            return;
        }

        // সিকিউরিটি পাসের পর পেজ দৃশ্যমান করবে
        document.body.style.display = 'block';

        // ডাটা শো করা
        document.getElementById('memberName').innerText = `স্বাগতম, ${currentMemberObj.name}`;
        document.getElementById('memberInfo').innerText = `আইডি: ${currentMemberObj.id} | টাইপ: ${currentMemberObj.type}`;
        document.getElementById('totalBalance').innerText = `৳ ${currentMemberObj.balance}`;
        document.getElementById('loanBalance').innerText = `৳ ${currentMemberObj.loan || 0}`;
        document.getElementById('phoneNo').innerText = currentMemberObj.phone;
        document.getElementById('tableBalance').innerText = `৳ ${currentMemberObj.balance}`;
    };

    function showReceipt(type) {
        if (!currentMemberObj) return;
        const today = new Date().toLocaleDateString('bn-BD');
        
        document.getElementById('recDate').innerText = today;
        document.getElementById('recName').innerText = currentMemberObj.name;
        document.getElementById('recId').innerText = currentMemberObj.id;
        document.getElementById('recType').innerText = type;
        document.getElementById('recAmount').innerText = `৳ ${currentMemberObj.balance}`;

        document.getElementById('receiptModal').style.display = 'flex';
    }

    function closeReceipt() {
        document.getElementById('receiptModal').style.display = 'none';
    }

    function logout() {
        sessionStorage.removeItem('loggedInMember');
        window.location.href = 'member-login.html';
    }
</script>
