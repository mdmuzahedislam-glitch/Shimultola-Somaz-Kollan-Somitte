<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন কন্ট্রোল প্যানেল - শিমুলতলা সমাজকল্যাণ সমবায় সমিতি</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; padding: 15px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { background: #b71c1c; color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        header h2 { font-size: 18px; }
        .logout-btn { background: #424242; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; }

        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h3.section-title { color: #b71c1c; border-bottom: 2px solid #eee; padding-bottom: 8px; margin-bottom: 15px; font-size: 16px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 8px 10px; text-align: center; font-size: 13px; }
        th { background: #ffebee; color: #b71c1c; }

        .btn { background: #2e7d32; color: white; border: none; padding: 7px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn:hover { background: #1b5e20; }
        .btn-danger { background: #c62828; }
        .btn-warning { background: #f57c00; color: white; }
        .preview-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #2e7d32; margin-top: 5px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h2>⚙️ এডমিন কন্ট্রোল প্যানেল</h2>
            <p style="font-size: 12px; opacity: 0.9;">শিমুলতলা সমাজকল্যাণ সমবায় সমিতি</p>
        </div>
        <a href="admin-login.html" class="logout-btn">লগআউট</a>
    </header>

    <div class="card">
        <h3 class="section-title">✏️ সমিতির নাম, ঠিকানা ও কন্টাক্ট এডিট</h3>
        <form id="siteInfoForm">
            <div class="form-grid">
                <div class="form-group"><label>সমিতির নাম:</label><input type="text" id="siteNameInput" required></div>
                <div class="form-group"><label>ঠিকানা / লোকেশন:</label><input type="text" id="siteAddressInput" required></div>
                <div class="form-group"><label>স্থাপিত সাল:</label><input type="text" id="siteEstInput" required></div>
                <div class="form-group"><label>মোবাইল নম্বর:</label><input type="text" id="sitePhoneInput" required></div>
                <div class="form-group"><label>ইমেইল:</label><input type="email" id="siteEmailInput" required></div>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>সমিতি সম্পর্কে বিবরণ:</label>
                <textarea id="siteAboutInput" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-warning">ওয়েবসাইটের তথ্য সংরক্ষণ করুন</button>
        </form>
    </div>

    <div class="card">
        <h3 class="section-title">👔 পরিচালকবৃন্দের নাম ও ছবি আপলোড</h3>
        <form id="directorForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>সভাপতির নাম:</label>
                    <input type="text" id="pNameInput" required>
                    <label style="margin-top:8px;">ছবি আপলোড:</label>
                    <input type="file" id="pImgFile" accept="image/*" onchange="previewFile('pImgFile', 'pPreview')">
                    <img id="pPreview" class="preview-img" src="https://via.placeholder.com/150/1b5e20/ffffff?text=President">
                </div>
                <div class="form-group">
                    <label>সাধারণ সম্পাদকের নাম:</label>
                    <input type="text" id="sNameInput" required>
                    <label style="margin-top:8px;">ছবি আপলোড:</label>
                    <input type="file" id="sImgFile" accept="image/*" onchange="previewFile('sImgFile', 'sPreview')">
                    <img id="sPreview" class="preview-img" src="https://via.placeholder.com/150/0288d1/ffffff?text=Secretary">
                </div>
                <div class="form-group">
                    <label>কার্যনির্বাহী সদস্যের নাম:</label>
                    <input type="text" id="mNameInput" required>
                    <label style="margin-top:8px;">ছবি আপলোড:</label>
                    <input type="file" id="mImgFile" accept="image/*" onchange="previewFile('mImgFile', 'mPreview')">
                    <img id="mPreview" class="preview-img" src="https://via.placeholder.com/150/f57c00/ffffff?text=Member">
                </div>
            </div>
            <button type="submit" class="btn btn-warning">পরিচালকবৃন্দের তথ্য ও ছবি সংরক্ষণ করুন</button>
        </form>
    </div>

    <div class="card">
        <h3 class="section-title">📢 জরুরি নোটিশ বোর্ড আপডেট</h3>
        <form id="noticeForm">
            <div class="form-group" style="margin-bottom: 10px;"><label>নোটিশ ১:</label><input type="text" id="notice1Input"></div>
            <div class="form-group" style="margin-bottom: 10px;"><label>নোটিশ ২:</label><input type="text" id="notice2Input"></div>
            <button type="submit" class="btn btn-warning">নোটিশ আপডেট করুন</button>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    if (sessionStorage.getItem('adminLoggedIn') !== 'true') {
        window.location.href = 'admin-login.html';
    }

    const firebaseConfig = {
        apiKey: "AIzaSyCU0D4b0D2T9QcR5k7JKPNXH-l_BXdbtX4",
        authDomain: "shimultola-somittee.firebaseapp.com",
        databaseURL: "https://shimultola-somittee-default-rtdb.firebaseio.com",
        projectId: "shimultola-somittee",
        storageBucket: "shimultola-somittee.firebasestorage.app",
        messagingSenderId: "889093640093",
        appId: "1:889093640093:web:2092d82fadf427f6fb2974",
        measurementId: "G-87QSPJ2M1R"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentData = {};
    let pImgData = "", sImgData = "", mImgData = "";

    onValue(ref(db, 'siteData'), (snapshot) => {
        if(snapshot.exists()) {
            currentData = snapshot.val();
            document.getElementById('siteNameInput').value = currentData.name || "";
            document.getElementById('siteAddressInput').value = currentData.address || "";
            document.getElementById('siteEstInput').value = currentData.est || "";
            document.getElementById('sitePhoneInput').value = currentData.phone || "";
            document.getElementById('siteEmailInput').value = currentData.email || "";
            document.getElementById('siteAboutInput').value = currentData.about || "";
            document.getElementById('pNameInput').value = currentData.pName || "";
            document.getElementById('sNameInput').value = currentData.sName || "";
            document.getElementById('mNameInput').value = currentData.mName || "";
            document.getElementById('notice1Input').value = currentData.notice1 || "";
            document.getElementById('notice2Input').value = currentData.notice2 || "";

            if(currentData.pImg) { pImgData = currentData.pImg; document.getElementById('pPreview').src = currentData.pImg; }
            if(currentData.sImg) { sImgData = currentData.sImg; document.getElementById('sPreview').src = currentData.sImg; }
            if(currentData.mImg) { mImgData = currentData.mImg; document.getElementById('mPreview').src = currentData.mImg; }
        }
    });

    window.previewFile = function(inputId, imgId) {
        const file = document.getElementById(inputId).files[0];
        if (file) {
            const reader = new FileReader();
            reader.onloadend = function() {
                document.getElementById(imgId).src = reader.result;
                if(inputId === 'pImgFile') pImgData = reader.result;
                if(inputId === 'sImgFile') sImgData = reader.result;
                if(inputId === 'mImgFile') mImgData = reader.result;
            }
            reader.readAsDataURL(file);
        }
    }

    document.getElementById('siteInfoForm').onsubmit = function(e) {
        e.preventDefault();
        currentData.name = document.getElementById('siteNameInput').value;
        currentData.address = document.getElementById('siteAddressInput').value;
        currentData.est = document.getElementById('siteEstInput').value;
        currentData.phone = document.getElementById('sitePhoneInput').value;
        currentData.email = document.getElementById('siteEmailInput').value;
        currentData.about = document.getElementById('siteAboutInput').value;

        set(ref(db, 'siteData'), currentData).then(() => {
            alert('ওয়েবসাইটের তথ্য সফলভাবে আপডেট হয়েছে!');
        });
    }

    document.getElementById('directorForm').onsubmit = function(e) {
        e.preventDefault();
        currentData.pName = document.getElementById('pNameInput').value;
        currentData.sName = document.getElementById('sNameInput').value;
        currentData.mName = document.getElementById('mNameInput').value;
        if(pImgData) currentData.pImg = pImgData;
        if(sImgData) currentData.sImg = sImgData;
        if(mImgData) currentData.mImg = mImgData;

        set(ref(db, 'siteData'), currentData).then(() => {
            alert('পরিচালকবৃন্দের তথ্য ও ছবি সফলভাবে আপডেট হয়েছে!');
        });
    }

    document.getElementById('noticeForm').onsubmit = function(e) {
        e.preventDefault();
        currentData.notice1 = document.getElementById('notice1Input').value;
        currentData.notice2 = document.getElementById('notice2Input').value;

        set(ref(db, 'siteData'), currentData).then(() => {
            alert('নোটিশ সফলভাবে আপডেট হয়েছে!');
        });
    }
</script>

</body>
</html>
