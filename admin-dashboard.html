<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন কন্ট্রোল প্যানেল - শিমুলতলা সমাজকল্যাণ সমবায় সমিতি</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; padding: 15px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { background: #b71c1c; color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        header h2 { font-size: 18px; }
        .logout-btn { background: #424242; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; }

        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h3.section-title { color: #b71c1c; border-bottom: 2px solid #eee; padding-bottom: 8px; margin-bottom: 15px; font-size: 16px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 8px 10px; text-align: center; font-size: 13px; }
        th { background: #ffebee; color: #b71c1c; }

        .btn { background: #2e7d32; color: white; border: none; padding: 7px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn:hover { background: #1b5e20; }
        .btn-danger { background: #c62828; }
        .btn-warning { background: #f57c00; color: white; }
        .btn-cancel { background: #757575; color: white; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 15px; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 100%; max-width: 500px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 15px; }
        .close-btn { cursor: pointer; font-size: 20px; font-weight: bold; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h2>⚙️ এডমিন কন্ট্রোল প্যানেল</h2>
            <p style="font-size: 12px; opacity: 0.9;">শিমুলতলা সমাজকল্যাণ সমবায় সমিতি</p>
        </div>
        <a href="admin-login.html" class="logout-btn">লগআউট</a>
    </header>

    <!-- ১. সমিতির হেডার ও তথ্য এডিট (Website Info Customizer) -->
    <div class="card">
        <h3 class="section-title">✏️ সমিতির নাম, ঠিকানা ও বিবরণ এডিট</h3>
        <form onsubmit="updateSiteInfo(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>সমিতির নাম:</label>
                    <input type="text" id="siteNameInput" required>
                </div>
                <div class="form-group">
                    <label>ঠিকানা / লোকেশন:</label>
                    <input type="text" id="siteAddressInput" required>
                </div>
                <div class="form-group">
                    <label>স্থাপিত সাল:</label>
                    <input type="text" id="siteEstInput" required>
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>সমিতি সম্পর্কে বিবরণ:</label>
                <textarea id="siteAboutInput" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-warning">ওয়েবসাইটের তথ্য সংরক্ষণ করুন</button>
        </form>
    </div>

    <!-- ২. জরুরি নোটিশ আপডেট -->
    <div class="card">
        <h3 class="section-title">📢 জরুরি নোটিশ বোর্ড আপডেট</h3>
        <form onsubmit="updateNotices(event)">
            <div class="form-group" style="margin-bottom: 10px;">
                <label>নোটিশ ১:</label>
                <input type="text" id="notice1Input">
            </div>
            <div class="form-group" style="margin-bottom: 10px;">
                <label>নোটিশ ২:</label>
                <input type="text" id="notice2Input">
            </div>
            <button type="submit" class="btn btn-warning">নোটিশ আপডেট করুন</button>
        </form>
    </div>

    <!-- ৩. নতুন সদস্য রেজিস্ট্রেশন -->
    <div class="card">
        <h3 class="section-title">➕ নতুন সদস্য রেজিস্ট্রেশন</h3>
        <form id="registerForm" onsubmit="registerMember(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>সদস্য আইডি:</label>
                    <input type="text" id="regId" placeholder="M-103" required>
                </div>
                <div class="form-group">
                    <label>নাম:</label>
                    <input type="text" id="regName" placeholder="পূর্ণ নাম" required>
                </div>
                <div class="form-group">
                    <label>ইউজারনেম:</label>
                    <input type="text" id="regUsername" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>পাসওয়ার্ড:</label>
                    <input type="text" id="regPassword" required>
                </div>
                <div class="form-group">
                    <label>ফোন নম্বর:</label>
                    <input type="tel" id="regPhone" required>
                </div>
                <div class="form-group">
                    <label>টাইপ:</label>
                    <select id="regType">
                        <option value="সাধারণ সদস্য">সাধারণ সদস্য</option>
                        <option value="কার্যনির্বাহী সদস্য">কার্যনির্বাহী সদস্য</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>জমা ব্যালেন্স (৳):</label>
                    <input type="number" id="regBalance" value="0" required>
                </div>
                <div class="form-group">
                    <label>বকেয়া ঋণ (৳):</label>
                    <input type="number" id="regLoan" value="0" required>
                </div>
            </div>
            <button type="submit" class="btn">সদস্য নিবন্ধন করুন</button>
        </form>
    </div>

    <!-- ৪. সদস্য তালিকা ম্যানেজমেন্ট -->
    <div class="card">
        <h3 class="section-title">👥 সদস্য তালিকা, জমা ও ঋণ ম্যানেজমেন্ট</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>আইডি</th>
                        <th>নাম</th>
                        <th>ইউজার / পাস</th>
                        <th>ফোন</th>
                        <th>ব্যালেন্স</th>
                        <th>ঋণ</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="memberTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- এডিট মোডাল -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <div class="modal-header">
            <h4>✏️ সদস্য তথ্য এডিট</h4>
            <span class="close-btn" onclick="closeModal()">&times;</span>
        </div>
        <form onsubmit="saveMemberChanges(event)">
            <input type="hidden" id="editIndex">
            <div class="form-group" style="margin-bottom: 10px;"><label>নাম:</label><input type="text" id="editName" required></div>
            <div class="form-group" style="margin-bottom: 10px;"><label>ফোন:</label><input type="text" id="editPhone" required></div>
            <div class="form-group" style="margin-bottom: 10px;"><label>পাসওয়ার্ড:</label><input type="text" id="editPassword" required></div>
            <div class="form-group" style="margin-bottom: 10px;"><label>জমা ব্যালেন্স (৳):</label><input type="number" id="editBalance" required></div>
            <div class="form-group" style="margin-bottom: 10px;"><label>বকেয়া ঋণ (৳):</label><input type="number" id="editLoan" required></div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">সংরক্ষণ করুন</button>
        </form>
    </div>
</div>

<script>
    if (sessionStorage.getItem('adminLoggedIn') !== 'true') {
        window.location.href = 'admin-login.html';
    }

    const initialMembers = [
        { id: "M-101", name: "মো: আব্দুল করিম", username: "karim101", password: "123", phone: "01711000001", type: "সাধারণ সদস্য", balance: 15000, loan: 5000 },
        { id: "M-102", name: "মো: রহিম মিয়া", username: "rahim102", password: "123", phone: "01711000002", type: "সাধারণ সদস্য", balance: 12508, loan: 0 }
    ];

    function getMembers() {
        const stored = localStorage.getItem('somitte_members');
        if (!stored) {
            localStorage.setItem('somitte_members', JSON.stringify(initialMembers));
            return initialMembers;
        }
        return JSON.parse(stored);
    }

    function renderMembers() {
        const members = getMembers();
        const tbody = document.getElementById('memberTableBody');
        tbody.innerHTML = '';
        members.forEach((m, index) => {
            tbody.innerHTML += `
                <tr>
                    <td><b>${m.id}</b></td>
                    <td>${m.name}</td>
                    <td><code>${m.username}</code> / <b>${m.password}</b></td>
                    <td>${m.phone}</td>
                    <td style="color: green; font-weight: bold;">৳ ${m.balance}</td>
                    <td style="color: #e65100; font-weight: bold;">৳ ${m.loan || 0}</td>
                    <td>
                        <button class="btn btn-warning" onclick="openEdit(${index})">এডিট</button>
                        <button class="btn btn-danger" onclick="delMember(${index})">মুছুন</button>
                    </td>
                </tr>`;
        });
    }

    function updateSiteInfo(e) {
        e.preventDefault();
        localStorage.setItem('somitte_name', document.getElementById('siteNameInput').value);
        localStorage.setItem('somitte_address', document.getElementById('siteAddressInput').value);
        localStorage.setItem('somitte_est', document.getElementById('siteEstInput').value);
        localStorage.setItem('somitte_about', document.getElementById('siteAboutInput').value);
        alert('ওয়েবসাইটের তথ্য সফলভাবে আপডেট করা হয়েছে!');
    }

    function updateNotices(e) {
        e.preventDefault();
        localStorage.setItem('somitte_notice1', document.getElementById('notice1Input').value);
        localStorage.setItem('somitte_notice2', document.getElementById('notice2Input').value);
        alert('নোটিশ সফলভাবে আপডেট করা হয়েছে!');
    }

    function registerMember(e) {
        e.preventDefault();
        const members = getMembers();
        members.push({
            id: document.getElementById('regId').value.trim(),
            name: document.getElementById('regName').value.trim(),
            username: document.getElementById('regUsername').value.trim(),
            password: document.getElementById('regPassword').value.trim(),
            phone: document.getElementById('regPhone').value.trim(),
            type: document.getElementById('regType').value,
            balance: parseFloat(document.getElementById('regBalance').value) || 0,
            loan: parseFloat(document.getElementById('regLoan').value) || 0
        });
        localStorage.setItem('somitte_members', JSON.stringify(members));
        alert('সদস্য সফলভাবে নিবন্ধিত হয়েছে!');
        document.getElementById('registerForm').reset();
        renderMembers();
    }

    function openEdit(index) {
        const m = getMembers()[index];
        document.getElementById('editIndex').value = index;
        document.getElementById('editName').value = m.name;
        document.getElementById('editPhone').value = m.phone;
        document.getElementById('editPassword').value = m.password;
        document.getElementById('editBalance').value = m.balance;
        document.getElementById('editLoan').value = m.loan || 0;
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('editModal').style.display = 'none'; }

    function saveMemberChanges(e) {
        e.preventDefault();
        const index = document.getElementById('editIndex').value;
        const members = getMembers();
        members[index].name = document.getElementById('editName').value;
        members[index].phone = document.getElementById('editPhone').value;
        members[index].password = document.getElementById('editPassword').value;
        members[index].balance = parseFloat(document.getElementById('editBalance').value) || 0;
        members[index].loan = parseFloat(document.getElementById('editLoan').value) || 0;
        localStorage.setItem('somitte_members', JSON.stringify(members));
        alert('সদস্যের তথ্য আপডেট হয়েছে!');
        closeModal();
        renderMembers();
    }

    function delMember(index) {
        if(confirm('মুছে ফেলতে চান?')) {
            const members = getMembers();
            members.splice(index, 1);
            localStorage.setItem('somitte_members', JSON.stringify(members));
            renderMembers();
        }
    }

    window.onload = function() {
        renderMembers();
        document.getElementById('siteNameInput').value = localStorage.getItem('somitte_name') || "শিমুলতলা সমাজকল্যাণ সমবায় সমিতি";
        document.getElementById('siteAddressInput').value = localStorage.getItem('somitte_address') || "ইসলামপুর, জামালপুর";
        document.getElementById('siteEstInput').value = localStorage.getItem('somitte_est') || "স্থাপিত: ২০২৪ ইং";
        document.getElementById('siteAboutInput').value = localStorage.getItem('somitte_about') || "শিমুলতলা সমাজকল্যাণ সমবায় সমিতি ২০২৪ সালে জামালপুর জেলার ইসলামপুর উপজেলায় প্রতিষ্ঠিত একটি বহুমুখী সমবায় সংগঠন।";
        document.getElementById('notice1Input').value = localStorage.getItem('somitte_notice1') || "";
        document.getElementById('notice2Input').value = localStorage.getItem('somitte_notice2') || "";
    };
</script>

</body>
</html>
